<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vishal Rathour Portfolio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: white;
    background: linear-gradient(270deg, #000, #111, #1a1a1a);
    background-size: 600% 600%;
    animation: bgMove 12s ease infinite;
}

@keyframes bgMove {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
}

header {
    text-align: center;
    padding: 60px;
}

header img {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 4px solid gold;
    object-fit: cover;
    transition: 0.4s;
}

header img:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px gold;
}

header h1 {
    color: gold;
    margin: 10px 0;
}

/* typing text */
#typing {
    border-right: 3px solid gold;
    padding-right: 5px;
    animation: blink 0.7s infinite;
    font-size: 18px;
}

@keyframes blink {
    0% {border-color: gold;}
    50% {border-color: transparent;}
    100% {border-color: gold;}
}

nav {
    display: flex;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding: 10px;
}

nav a {
    margin: 0 15px;
    color: #00ff88;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    color: gold;
    text-shadow: 0 0 10px gold;
}

section {
    padding: 50px;
    text-align: center;
}

/* glass effect */
.glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 20px;
    margin: 20px auto;
    width: 80%;
    transition: 0.3s;
}

.glass:hover {
    box-shadow: 0 0 20px rgba(255,215,0,0.3);
}

h2 {
    color: gold;
}

/* cards */
.cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    background: rgba(255,255,255,0.08);
    margin: 15px;
    padding: 20px;
    border-radius: 15px;
    width: 250px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 0 20px #00ff88;
}

/* button */
.btn {
    display: inline-block;
    margin: 10px;
    padding: 10px 20px;
    background: gold;
    color: black;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    background: white;
    box-shadow: 0 0 10px white;
}

.social a {
    color: white;
    font-size: 25px;
    margin: 10px;
    transition: 0.3s;
}

.social a:hover {
    color: gold;
    transform: scale(1.2);
}

footer {
    text-align: center;
    padding: 20px;
}

</style>
</head>

<body>

<header>
    <img src="photo.jpg">
    <h1>Vishal Rathour</h1>
    <p><span id="typing"></span></p>

    <a href="resume.pdf" download class="btn">Download Resume</a>
</header>

<nav>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#contact">Contact</a>
</nav>

<section id="about">
    <div class="glass">
        <h2>About Me</h2>
        <p>I am a passionate developer building modern websites with premium UI design.</p>
    </div>
</section>

<section id="skills">
    <div class="glass">
        <h2>Skills</h2>
        <div class="cards">
            <div class="card">HTML</div>
            <div class="card">CSS</div>
            <div class="card">JavaScript</div>
        </div>
    </div>
</section>

<section id="contact">
    <div class="glass">
        <h2>Contact</h2>
        <p>📞: +91 8126691892</p>
        <p>📧: vrathour198@gmail.com</p>

        <div class="social">
            <a href="https://www.instagram.com/10rishabhrathore/" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>

            <a href="https://www.linkedin.com/in/vishal-rathour-4105ab3a4/" target="_blank">
                <i class="fab fa-linkedin"></i>
            </a>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Vishal Rathour</p>
</footer>

<script>
const texts = ["Frontend Developer", "Web Designer", "Student"];
let count = 0;
let index = 0;
let currentText = "";
let letter = "";

(function type() {
    if (count === texts.length) {
        count = 0;
    }
    currentText = texts[count];
    letter = currentText.slice(0, ++index);

    document.getElementById("typing").textContent = letter;

    if (letter.length === currentText.length) {
        count++;
        index = 0;
        setTimeout(type, 1000);
    } else {
        setTimeout(type, 100);
    }
})();
</script>

</body>
</html>
